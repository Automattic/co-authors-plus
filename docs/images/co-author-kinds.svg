<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 365" width="1180" height="365" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328">
	<title id="title">The four kinds of co-author</title>
	<desc id="desc">Four columns across rows for terms, profile and account. A: a user only has one term, and the user is both profile and account. B: a guest author only has one term, a profile and no account. C: a linked pair with different slugs has two terms, with the guest author as profile and the user as account. D: a linked pair with the same slug shares one term, with the guest author as profile and the user as account.</desc>
	<defs>
		<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
			<path d="M0 0L10 5L0 10z" fill="#1f2328"/>
		</marker>
		<style>
			.column { fill: #fff; stroke: #8c959f; }
			.heading { font-size: 14px; font-weight: 600; text-anchor: middle; }
			.row { font-weight: 600; }
			.box { stroke: #1f2328; }
			.term { fill: #fff3d6; }
			.user { fill: #dcebfa; }
			.guest { fill: #efe3fa; }
			.none { fill: #fff; stroke-dasharray: 5 4; }
			.label { text-anchor: middle; }
			.join { fill: none; stroke: #1f2328; stroke-width: 1.5; marker-end: url(#arrow); }
			.pad { fill: #fff; }
		</style>
	</defs>
	<rect width="1180" height="365" fill="#fff"/>

	<text class="row" x="12" y="92">Terms</text>
	<text class="row" x="12" y="202">Profile</text>
	<text class="row" x="12" y="312">Account</text>

	<!-- A. User only -->
	<rect class="column" x="80" y="10" width="190" height="345" rx="6"/>
	<text class="heading" x="175" y="36">A. User only</text>
	<rect class="box term" x="90" y="60" width="170" height="55" rx="6"/>
	<text class="label" x="175" y="92">Term cap-john-doe</text>
	<path class="join" d="M175 115V169"/>
	<rect class="box user" x="90" y="170" width="170" height="165" rx="6"/>
	<text class="label" x="175" y="248">User john.doe</text>
	<text class="label" x="175" y="266">profile and account</text>

	<!-- B. Guest author only -->
	<rect class="column" x="285" y="10" width="190" height="345" rx="6"/>
	<text class="heading" x="380" y="36">B. Guest author only</text>
	<rect class="box term" x="295" y="60" width="170" height="55" rx="6"/>
	<text class="label" x="380" y="92">Term cap-jane-smith</text>
	<path class="join" d="M380 115V169"/>
	<rect class="box guest" x="295" y="170" width="170" height="55" rx="6"/>
	<text class="label" x="380" y="193">Guest author jane-smith</text>
	<text class="label" x="380" y="211">profile</text>
	<rect class="box none" x="295" y="280" width="170" height="55" rx="6"/>
	<text class="label" x="380" y="312">No account</text>

	<!-- C. Linked, different slugs -->
	<rect class="column" x="490" y="10" width="425" height="345" rx="6"/>
	<text class="heading" x="702" y="36">C. Linked, different slugs: two terms</text>
	<rect class="box term" x="500" y="60" width="170" height="55" rx="6"/>
	<text class="label" x="585" y="83">Term cap-jdoe</text>
	<text class="label" x="585" y="101">assigned before the link</text>
	<rect class="box term" x="735" y="60" width="170" height="55" rx="6"/>
	<text class="label" x="820" y="83">Term cap-john-doe</text>
	<text class="label" x="820" y="101">assigned after the link</text>
	<path class="join" d="M820 115V169"/>
	<rect class="box guest" x="735" y="170" width="170" height="55" rx="6"/>
	<text class="label" x="820" y="193">Guest author john-doe</text>
	<text class="label" x="820" y="211">profile</text>
	<path class="join" d="M585 115V279"/>
	<rect class="box user" x="500" y="280" width="170" height="55" rx="6"/>
	<text class="label" x="585" y="303">User jdoe</text>
	<text class="label" x="585" y="321">account</text>
	<path class="join" d="M820 225V307H671"/>
	<rect class="pad" x="755" y="256" width="130" height="20"/>
	<text class="label" x="820" y="271">cap-linked_account</text>

	<!-- D. Linked, same slug -->
	<rect class="column" x="930" y="10" width="240" height="345" rx="6"/>
	<text class="heading" x="1050" y="36">D. Linked, same slug: one term</text>
	<rect class="box term" x="965" y="60" width="170" height="55" rx="6"/>
	<text class="label" x="1050" y="83">Term cap-john-doe</text>
	<text class="label" x="1050" y="101">all posts</text>
	<path class="join" d="M1050 115V169"/>
	<rect class="pad" x="990" y="132" width="120" height="20"/>
	<text class="label" x="1050" y="147">guest author wins</text>
	<rect class="box guest" x="965" y="170" width="170" height="55" rx="6"/>
	<text class="label" x="1050" y="193">Guest author john-doe</text>
	<text class="label" x="1050" y="211">profile</text>
	<path class="join" d="M1050 225V279"/>
	<rect class="pad" x="985" y="242" width="130" height="20"/>
	<text class="label" x="1050" y="257">cap-linked_account</text>
	<rect class="box user" x="965" y="280" width="170" height="55" rx="6"/>
	<text class="label" x="1050" y="303">User john-doe</text>
	<text class="label" x="1050" y="321">account</text>
</svg>
