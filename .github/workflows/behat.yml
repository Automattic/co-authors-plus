name: Behat Tests

on:
  pull_request:
    paths:
      - '.github/workflows/behat.yml'
      - '**.php'
      - '**.feature'
      - 'behat.yml'
      - 'composer.json'
      - '.wp-env.json'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches:
      - develop
      - main
    paths:
      - '.github/workflows/behat.yml'
      - '**.php'
      - '**.feature'
      - 'behat.yml'
      - 'composer.json'
      - '.wp-env.json'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  behat:
    name: Behat Tests (WP trunk, PHP 8.6)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set up PHP 8.6
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.6'
          coverage: none

      - name: Install Composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

      # wp-env downloads WordPress/WordPress once, for the development environment,
      # so the tests environment's own "core" is never fetched. WP_ENV_CORE sets
      # both environments, so Behat (which uses tests-cli) really runs trunk.
      - name: Setup wp-env
        run: npx --no wp-env start
        env:
          WP_ENV_CORE: WordPress/WordPress#master
          # Without this, wp-env runs the PHP version in .wp-env.json.
          WP_ENV_PHP_VERSION: '8.6'

      - name: Run Behat tests
        run: composer behat

      - name: Rerun failed tests
        if: failure()
        run: composer behat-rerun
