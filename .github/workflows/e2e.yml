name: E2E Tests

on:
  pull_request:
    paths:
      - '**.php'
      - '**.js'
      - '**.jsx'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.js'
      - 'tests/e2e/**'
      - '.wp-env.json'
      - '.github/workflows/e2e.yml'
  push:
    branches:
      - develop
      - main
    paths:
      - '**.php'
      - '**.js'
      - '**.jsx'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.js'
      - 'tests/e2e/**'
      - '.wp-env.json'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

# Disable all permissions by default; grant minimal permissions per job.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E (block editor, WP ${{ matrix.wordpress }}, PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      matrix:
        include:
          # Check lowest supported WP version, with the lowest supported PHP.
          - wordpress: '6.4'
            core: 'WordPress/WordPress#6.4'
            php: '7.4'
          # The WP version in the readme's "Tested up to", with the latest PHP.
          # The -branch ref tracks the latest point release; '#7.1' is the 7.1.0 tag.
          - wordpress: '7.1'
            core: 'WordPress/WordPress#7.1-branch'
            php: '8.5'
          # The next WP version, with the latest PHP.
          - wordpress: 'trunk'
            core: 'WordPress/WordPress#master'
            php: '8.5'
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build block assets
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Start wp-env
        run: npx --no wp-env start
        env:
          WP_ENV_CORE: ${{ matrix.core }}
          WP_ENV_PHP_VERSION: ${{ matrix.php }}

      # E2E runs against the dev environment, served in CI on the default port 8888.
      # WP_ENV_CORE sets the matrix's WordPress for both environments.
      - name: Run E2E tests
        run: npm run test:e2e
        env:
          WP_BASE_URL: http://localhost:8888
