name: Run JS linting

on:
  pull_request:
    paths:
      - '**.js'
      - '**.jsx'
      - '**.css'
      - '**.scss'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/lint.yml'
  push:
    branches:
      - develop
      - main
    paths:
      - '**.js'
      - '**.jsx'
      - '**.css'
      - '**.scss'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/lint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Run JS linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint on JS files
        run: npm run lint:js

      - name: Run Stylelint on CSS files
        run: npm run lint:css
