name: Run JS linting

on:
  pull_request:
    paths:
      - '**.js'
      - '**.jsx'
      - '**.css'
      - '**.scss'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/lint.yml'
  push:
    branches:
      - develop
      - main
    paths:
      - '**.js'
      - '**.jsx'
      - '**.css'
      - '**.scss'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/lint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Run JS linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint on JS files
        run: npm run lint:js

      - name: Run Stylelint on CSS files
        run: npm run lint:css
